<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/styles.css}">
    <title>Reed Catalog</title>
</head>

<body>
    <div class="container">
        <h1>Reed Catalog</h1>
        <section><a class="button-secondary" th:href="@{/partner/partner-list}">List of Partners</a></section>
        <div class="table-container">
            <h2>Log:</h2>
            <table>
                <thead>
                    <tr>
                        <th>Date-Time</th>
                        <th>Event</th>
                        <th>Order no.</th>
                        <th>Partner</th>
                        <th>Money exchange</th>
                        <th>Actual balance</th>
                    </tr>
                </thead>
                <tbody>
                    <th:block th:each="log : ${logList}">
                        <tr th:object="${log}">
                            <td th:text="*{dateTime}"></td>
                            <td th:text="*{event}"></td>
                            <td th:text="*{eventId}?*{eventId}:'-'"></td>
                            <td th:if="*{partnerDTO()}"><a th:text="*{partnerDTO.name}"
                                    th:href="|@{/partner/profile}?id=*{partnerDTO().id()}|"></a></td>
                            <td th:if="!*{partnerDTO()}">-</td>
                            <td th:text="*{moneyExchange}?*{moneyExchange}:'-'"></td>
                            <td th:text="*{actualBalance}"></td>
                        </tr>
                    </th:block>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
