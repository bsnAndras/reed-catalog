<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/styles.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/form-styles.css}">
    <title>Reed Catalog</title>
</head>

<body>
<div class="container">
    <div class="form-container">
        <h1>Placing new order</h1>
        <form th:method="'post'" th:object="${requestDto}" th:action="@{/partner/new-order}">
            <div class="input-group">
                <label for="partner">Partner:</label>
                <select th:field="*{partnerId}" name="partnerId" id="partner">
                    <option th:text="${partner.name()}" th:value="*{partnerId}"></option>
                </select>
            </div>
            <div class="input-group">
                <label for="price">Total Price:</label>
                <div>
                    <input type="number" id="price" th:field="*{totalPrice}" required>
                    <span th:text="Ft"></span>
                </div>
                <label for="notes">Notes: </label>
                <input type="text" id="notes" th:field="*{notes}">
            </div>
            <div class="button-container">
                <button type="submit" class="button-primary">Place Order</button>
            </div>
        </form>
    </div>
</div>
</body>

</html>
